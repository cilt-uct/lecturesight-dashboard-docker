services:
  web:
    build: .
    restart: always
    ports:
      - "127.0.0.1:5000:8000"
    environment:
      STATUS_TOKEN: ${STATUS_TOKEN:-}
    volumes:
      - ./code/venues:/app/code/venues
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
